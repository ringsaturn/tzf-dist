name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.0.2026-a)"
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    environment:
      name: publish
      url: https://crates.io/crates/tzf-dist
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - name: Compose release notes
        run: |
          {
            cat STATS.md
            printf '\n'
            cat BORDER_CHANGE.md
          } > RELEASE_NOTES.md

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          body_path: RELEASE_NOTES.md
          files: |
            combined-with-oceans.compress.topo.bin
            combined-with-oceans.topology.compress.topo.bin
            combined-with-oceans.topology.preindex.bin
            checksums.md5

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify tag matches Cargo version
        shell: bash
        run: |
          tag_version="${{ inputs.tag }}"
          tag_version="${tag_version#v}"
          cargo_version="$(cargo pkgid | sed -E 's/.*#//')"

          if [ "${tag_version}" != "${cargo_version}" ]; then
            echo "Tag version ${tag_version} does not match Cargo.toml version ${cargo_version}."
            exit 1
          fi

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish crate
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
